name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── windows probe ────────────────────────────────────────────────────────────
# The plugin carries win32-specific code paths (named-pipe IPC, hook gating).
# This job is non-blocking until it is known-green on the runner.

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Component test suites
        run: npm run test:components

      - name: Build
        run: npm run build

      - name: Verify hook policies
        run: npm run verify:hook-policies

      - name: Verify dist reproducibility
        run: npm run verify:reproducible

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-probe:
    name: windows probe (node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Component test suites
        run: npm run test:components
