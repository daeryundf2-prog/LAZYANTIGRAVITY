name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -- windows probe -----------------------------------------------------------
# The plugin carries win32-specific code paths (named-pipe IPC, hook gating).
# Blocking: Windows regressions fail CI.

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify contract drift (checkout byte integrity)
        run: node scripts/check_contract_drift.mjs

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check forbidden TypeScript syntax (AGENTS.md)
        # --experimental-strip-types needs Node >=20.19/22.6 (setup-node latest satisfies this)
        run: node --experimental-strip-types shared-skills/skills/programming/scripts/typescript/check-no-excuse-rules.ts --only=no-any-assertion,no-unknown-assertion,no-ts-ignore,no-ts-expect-error,no-enum,no-non-null-assertion,no-default-export components

      - name: Configure Git for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install ast-grep-mcp engine dependency
        run: npm --prefix ast-grep-mcp ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Component test suites
        run: npm run test:components

      - name: Build
        run: npm run build

      - name: Verify hook policies
        run: npm run verify:hook-policies

      - name: Verify skills sync (aggregate skills/ drift)
        run: npm run sync:skills && git diff --exit-code -- skills/ shared-skills/

      - name: Verify dist reproducibility
        run: npm run verify:reproducible

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        if: matrix.node == '22'
        run: node scripts/gen-sbom.mjs --output sbom.cdx.json

      - name: Upload SBOM artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  windows-probe:
    name: windows (node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify contract drift (checkout byte integrity)
        run: node scripts/check_contract_drift.mjs

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check forbidden TypeScript syntax (AGENTS.md)
        # --experimental-strip-types needs Node >=20.19/22.6 (setup-node latest satisfies this)
        run: node --experimental-strip-types shared-skills/skills/programming/scripts/typescript/check-no-excuse-rules.ts --only=no-any-assertion,no-unknown-assertion,no-ts-ignore,no-ts-expect-error,no-enum,no-non-null-assertion,no-default-export components

      - name: Install ast-grep-mcp engine dependency
        run: npm --prefix ast-grep-mcp ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Component test suites
        run: npm run test:components

      - name: Verify hook policies
        run: npm run verify:hook-policies

      - name: Verify skills sync (aggregate skills/ drift)
        run: npm run sync:skills && git diff --exit-code -- skills/ shared-skills/

      - name: Verify dist reproducibility
        run: npm run verify:reproducible
