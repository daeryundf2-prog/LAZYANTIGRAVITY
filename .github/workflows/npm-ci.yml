name: NPM CI

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "plugins/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "plugins/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pack:
    runs-on: ${{ matrix.os }}
    env:
      GEMINI_HOME: ${{ runner.temp }}/gemini-home
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            plugins/omo/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install plugin dependencies
        run: npm ci --prefix plugins/omo

      - name: Build components
        run: npm run build --prefix plugins/omo

      - name: Run root tests
        run: npm test

      - name: Biome check
        run: npm run lint --prefix plugins/omo/components/ulw-loop

      - name: Run ulw-loop component tests
        run: npm test --prefix plugins/omo/components/ulw-loop

      - name: Verify CLI Help
        run: |
          node plugins/omo/components/ulw-loop/dist/cli.js --help
          node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop help
          node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop resume

      - name: Verify dry-run scenarios
        run: |
          node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop dry-run --scenario happy-path
          node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop dry-run --scenario quota-opus-exhausted
          node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop dry-run --scenario quota-opus-exhausted --json
          node -e "JSON.parse(require('child_process').execSync('node plugins/omo/components/ulw-loop/dist/cli.js ulw-loop dry-run --scenario quota-opus-exhausted --json').toString())"


      - name: Install plugin to isolated GEMINI_HOME
        run: node bin/lazyantigravity.js install

      - name: Verify drift
        run: npm run verify:drift -- --strict

      - name: Dry-run package
        run: npm pack --dry-run --json
