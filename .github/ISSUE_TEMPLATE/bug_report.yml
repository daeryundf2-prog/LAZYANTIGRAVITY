name: Bug Report
description: File a bug report with reproduction steps and logs
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue to LazyAntigravity!
  - type: input
    id: version
    attributes:
      label: LazyAntigravity Version
      description: What version of LazyAntigravity are you running? (e.g. v0.7.0)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Evidence
      render: shell
